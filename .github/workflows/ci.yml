name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run verification suite
        run: python preprints/cin_sovereign_agent_systems/experiment.py && python -m unittest discover -s research/ledger_sim -p "test_*.py" -v
